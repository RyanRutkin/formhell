name: Deploy Playground to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pages Uses GitHub Actions
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const { owner, repo } = context.repo;

            try {
              const current = await github.request("GET /repos/{owner}/{repo}/pages", {
                owner,
                repo
              });

              if (current.data?.build_type === "workflow") {
                core.info("GitHub Pages is already configured for GitHub Actions.");
              } else {
                core.info(`Current build_type is '${current.data?.build_type ?? "unknown"}'. Attempting to switch to 'workflow'.`);
                await github.request("PUT /repos/{owner}/{repo}/pages", {
                  owner,
                  repo,
                  build_type: "workflow"
                });
                core.info("Updated GitHub Pages build_type to 'workflow'.");
              }
            } catch (error) {
              core.warning(`Could not automatically enforce Pages build_type=workflow: ${error.message}`);
            }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            playground/package-lock.json

      - name: Install playground dependencies
        working-directory: playground
        run: npm install

      - name: Generate sitemap
        run: node scripts/generate-playground-sitemap.mjs

      - name: Guard unresolved imports
        working-directory: playground
        run: npm run check:imports

      - name: Run playground tests
        working-directory: playground
        run: npm test

      - name: Build playground
        working-directory: playground
        run: npm run build

      - name: Verify playground artifact
        run: |
          test -f playground/dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
